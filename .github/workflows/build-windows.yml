name: Build Windows Release

# .NET 8 + WPF 仍是 Windows-only 技术栈，macOS/Linux 无法构建或运行，因此 CI 只产出 Windows 版本。
# 产物为框架依赖单文件：目标机需安装 .NET 8 Desktop Runtime（缺失时 Windows 会给出带下载链接的提示）。
#
# 7-Zip 不打包进发布物：用户需自行从 https://www.7-zip.org 安装，
# UZIP2 会自动检测系统安装位置，或在设置页手动指定 7z.exe 路径。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # 与 scripts/version.ps1、build-linux.yml 同一规则：Avalonia 的 csproj 是权威，
          # WPF 的 AssemblyInfo 必须与它一致，漂移就让发布中止。
          v=$(sed -n 's:.*<Version>[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*</Version>.*:\1:p' \
                UZIP2.Avalonia/UZIP2.Avalonia.csproj | head -1 | cut -d. -f1-3)
          test -n "$v" || { echo 'UZIP2.Avalonia.csproj 里没有 <Version>x.y.z</Version>'; exit 1; }
          a=$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' \
                UZIP2/Properties/AssemblyInfo.cs | head -1 | cut -d. -f1-3)
          test "$v" = "$a" || { echo "版本号不一致：csproj=$v AssemblyInfo=$a"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "版本：$v"
        # 注意：这条用 bash（windows-latest 自带 Git Bash）。脚本内容与
        # build-linux.yml 的完全相同，因为 sed/cut 在两种 runner 上都有。

      - name: Test the WPF shell
        run: dotnet test UZIP2.Tests/UZIP2.Tests.csproj -c Release --nologo

      # Avalonia 壳的无头测试在 Linux CI 里已经跑了；这里补上 Windows 侧，
      # 因为 Avalonia 的渲染后端在 Windows 上走的是另一条路径（Win32 + Skia，
      # 不经过 X11），XAML 或平台分支写错时只有 Windows 会炸。
      #
      # 两个坑：
      #   1. 不需要 EnableWindowsTargeting：UZIP2.Avalonia 的 TFM 是 net8.0（不是
      #      net8.0-windows），在 windows-latest 上是原生支持的构建目标。
      #   2. 不需要 apt 那一步装 libfontconfig1：Windows runner 上没有 fontconfig，
      #      Avalonia 在 Windows 上也不 dlopen 它。测试里已经用
      #      UseHeadless(UseHeadlessDrawing = false) + Skia，不依赖真实桌面。
      - name: Test the Avalonia shell (headless, Windows)
        run: dotnet test UZIP2.Avalonia.Tests/UZIP2.Avalonia.Tests.csproj -c Release --nologo

      - name: Publish single-file
        # 必须用 -p:SelfContained=false 而不是 "--self-contained false"：.NET 10 把
        # --self-contained 改成了纯开关，空格形式的 false 不再当取值，会把整个运行时
        # 打进单文件（实测 144 MB vs 正确的 9 MB）。release/UZIP2.exe 是应用内自更新
        # 下载的那个附件，体积错了会让每次更新多下 135 MB。
        run: >
          dotnet publish UZIP2 -c Release -r win-x64 -p:SelfContained=false
          -p:PublishSingleFile=true -o release

      - name: Assemble publish folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path release/Config -Force | Out-Null
          Remove-Item release/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem release -Recurse | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UZIP2-windows
          path: release/
          retention-days: 14
