name: Build Linux

# Linux 版（图形界面 + 命令行，同一个二进制）+ 各发行版安装包。
# 产物：
#   UZIP2-<ver>-linux-x64.tar.gz / -arm64.tar.gz（自包含单文件，含 .sha256 侧车）
#   uzip2_<ver>_amd64.deb / uzip2_<ver>_arm64.deb
#   uzip2-<ver>-<rel>.x86_64.rpm / .aarch64.rpm
#   UZIP2-<ver>-linux-x64.AppImage
#   uzip2-<ver>-<rel>-<arch>.pkg.tar.zst（makepkg 真构建，安装后冒烟）
#
# Linux 版不依赖 WPF，所以可以在 Linux 上直接 dotnet publish；
# Windows 的 GUI 发布会话与这里互不影响。
#
# 构建（两个架构）+ 打包（deb/rpm/AppImage）拆成两个 job：
# 打包只需要 tar.gz 当输入，不该为了拿它而重跑一遍 dotnet publish。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # 版本号的权威来源是 Avalonia 的 csproj（真正发货的产物），
          # 与 scripts/version.ps1、scripts/package-linux.sh 保持一致。
          # 这里再用 Bash 复查一次 WPF 的 AssemblyInfo：两边漂移就直接失败，
          # 而不是发出一个"包名一个版本、程序自报另一个版本"的产物。
          v=$(sed -n 's:.*<Version>[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*</Version>.*:\1:p' \
                UZIP2.Avalonia/UZIP2.Avalonia.csproj | head -1 | cut -d. -f1-3)
          test -n "$v" || { echo 'UZIP2.Avalonia.csproj 里没有 <Version>x.y.z</Version>'; exit 1; }
          a=$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' \
                UZIP2/Properties/AssemblyInfo.cs | head -1 | cut -d. -f1-3)
          test "$v" = "$a" || { echo "版本号不一致：csproj=$v AssemblyInfo=$a"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "版本：$v"

      - name: Test the Avalonia shell (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1
          dotnet test UZIP2.Avalonia.Tests/UZIP2.Avalonia.Tests.csproj -c Release --nologo

      - name: Publish both architectures
        # 交叉发布 linux-arm64 不需要 qemu：SDK 直接产出 aarch64 ELF，
        # 只是不能在 x86_64 runner 上"运行"它（所以 arm64 只做结构与可执行位校验）。
        shell: pwsh
        run: ./scripts/publish-linux.ps1 -Dotnet dotnet

      - name: Verify both tarballs (x64 runs, arm64 is inspected)
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.value }}"
          sudo apt-get update -qq && sudo apt-get install -y -qq file
          # 7z 的包名随 Ubuntu 版本变（22.04: p7zip-full / 24.04+: 7zip）
          sudo apt-get install -y -qq 7zip || sudo apt-get install -y -qq p7zip-full
          command -v 7z >/dev/null || { echo '装不上 7z'; exit 1; }

          for arch in x64 arm64; do
            tarball="artifacts/$v/UZIP2-$v-linux-$arch.tar.gz"
            test -f "$tarball" || { echo "缺少 $tarball"; exit 1; }

            # 侧车 hash 必须与文件一致：发布页面上那一行就是从这里来的
            ( cd "artifacts/$v" && sha256sum -c "UZIP2-$v-linux-$arch.tar.gz.sha256" )

            dest="/tmp/smoke-$arch"
            mkdir -p "$dest"
            tar -xzf "$tarball" -C "$dest"
            bin="$dest/UZIP2-$v-linux-$arch/UZIP2"
            test -x "$bin" || { echo "$arch 的 UZIP2 没有可执行位"; exit 1; }

            # 单文件 bundle 不能被 strip：86 MB 量级的 ELF 被 strip 后会掉到 ~10 MB。
            # 注意 `file` 会报 "stripped"——那是**外层 host ELF** 的节头判定，
            # .NET 的 bundle（manifest + 压缩程序集）是追加在 ELF 之后的裸数据，
            # 不属于任何节，所以 file 看不出来。真正的判据是体积 + 能不能跑。
            size_mb=$(( $(wc -c < "$bin") / 1024 / 1024 ))
            echo "$arch 二进制：${size_mb} MB"
            test "$size_mb" -gt 30 || { echo "$arch 二进制只有 ${size_mb} MB，疑似被 strip"; exit 1; }

            # LC_ALL=C：readelf 会跟着 locale 输出（中文环境是「系统架构」而不是
            # Machine），不锁 locale 的话下面的 grep 在非英文 runner 上会匹配不到，
            # set -e 下直接把整个步骤判失败。
            echo "--- $arch ELF 机器类型 ---"
            machine=$(LC_ALL=C readelf -h "$bin" | LC_ALL=C sed -n 's/^ *Machine: *//p')
            echo "$arch => $machine"
            case "$arch" in
              x64)   expect='X86-64' ;;
              arm64) expect='AArch64' ;;
            esac
            case "$machine" in
              *"$expect"*) echo "$arch 机器类型正确（$expect）" ;;
              *) echo "错误：$arch 的 ELF 机器类型是 '$machine'，期望含 '$expect' —— 交叉发布拿错了 RID？"; exit 1 ;;
            esac
          done

          # x64 真跑一遍 CLI（arm64 在 x86_64 runner 上无法执行）
          x64bin="/tmp/smoke-x64/UZIP2-$v-linux-x64/UZIP2"
          "$x64bin" --version
          cd /tmp/smoke-x64
          echo hello > a.txt
          7z a p.zip a.txt >/dev/null
          "$x64bin" extract p.zip -o out
          test -f out/a.txt || { echo '解压冒烟失败'; exit 1; }

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: UZIP2-linux
          path: |
            artifacts/${{ steps.ver.outputs.value }}/*.tar.gz
            artifacts/${{ steps.ver.outputs.value }}/*.tar.gz.sha256
            artifacts/${{ steps.ver.outputs.value }}/SHA256SUMS-linux.txt
          retention-days: 14

  linux-packages:
    # deb / rpm / AppImage 只做"把已发布的二进制装进包"，不重新发布。
    needs: linux-binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's:.*<Version>[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*</Version>.*:\1:p' \
                UZIP2.Avalonia/UZIP2.Avalonia.csproj | head -1 | cut -d. -f1-3)
          test -n "$v" || { echo 'UZIP2.Avalonia.csproj 里没有 <Version>x.y.z</Version>'; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          name: UZIP2-linux
          path: artifacts/${{ steps.ver.outputs.value }}

      - name: Install packaging tools
        run: |
          # dpkg-deb 在 ubuntu runner 上本来就有（没有时脚本会自动回退到 ar + tar）；
          # rpm 提供 rpmbuild/rpm/rpm2cpio；cpio 供拆 rpm payload。
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm cpio file
          # 7z 命令的包名随 Ubuntu 版本变：22.04 是 p7zip-full，24.04 起是 7zip。
          # 不写死其中一个，两个都试，缺了就让整个 job 失败（冒烟测试要用它）。
          sudo apt-get install -y -qq 7zip || sudo apt-get install -y -qq p7zip-full
          command -v 7z >/dev/null || { echo '装不上 7z（试过 7zip 与 p7zip-full）'; exit 1; }
          mkdir -p "$HOME/.local/bin"
          # appimagetool 是 AppImage 的唯一硬依赖：直接下 release 里的 x86_64 AppImage，
          # 用 --appimage-extract-and-run 调用（runner 上不一定有 FUSE）。
          curl -fsSL --retry 3 -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo '--- 工具自检 ---'
          rpmbuild --version | head -1
          dpkg-deb --version | head -1
          7z 2>&1 | head -2
          "$HOME/.local/bin/appimagetool" --version || \
            "$HOME/.local/bin/appimagetool" --appimage-extract-and-run --version

      - name: Build x64 packages (deb, rpm, AppImage)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-linux.sh \
            --arch x64 --formats deb,rpm,appimage \
            --tarball-dir "artifacts/${{ steps.ver.outputs.value }}"

      # arm64 只发 tar.gz（+ 它的 .sha256 侧车），刻意**不**在这里产 arm64 的
      # deb/rpm/AppImage：
      #   * 任务规格明确要求 arm64 只出 tar.gz；
      #   * 这三样在 x86_64 runner 上属于「交叉打包」，本机没有 arm64 环境可以
      #     真装一次验证，一旦哪天 rpmbuild/appimagetool 的行为变了，红的就是
      #     发版当天的 CI；
      #   * 真要在 arm64 上出这三样，装好工具后直接跑
      #       bash scripts/package-linux.sh --arch arm64 --formats deb,rpm
      #     就行（脚本已支持，纯数据打包不需要交叉编译器），只是不放进默认 CI。

      - name: Check package metadata and payload
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.value }}"
          d="artifacts/$v"

          echo '===== deb 元数据 ====='
          deb="uzip2_${v}_amd64.deb"
          dpkg-deb -I "$d/$deb" | sed 's/^/  /'

          # Depends 是包能不能装的关键：p7zip-full 与 7zip 二选一（Ubuntu 24.04
          # 已经没有 p7zip-full，只剩 7zip），图形库按发行版真实包名写。
          dpkg-deb -f "$d/$deb" Depends > /tmp/dep.txt
          cat /tmp/dep.txt
          grep -q '7zip' /tmp/dep.txt || { echo "$deb 的 Depends 里没有 7zip"; exit 1; }
          grep -q 'libx11-6' /tmp/dep.txt || { echo "$deb 的 Depends 里没有 libx11-6"; exit 1; }
          grep -q 'libfontconfig1' /tmp/dep.txt || { echo "$deb 的 Depends 里没有 libfontconfig1"; exit 1; }
          echo "$deb Depends OK"

          echo '===== rpm 元数据 ====='
          rpmf=$(ls "$d"/uzip2-"$v"-1.x86_64.rpm)
          rpm -qip "$rpmf" | sed 's/^/  /'
          rpm -q --requires -p "$rpmf" | grep -q p7zip || { echo 'rpm 的 Requires 里没有 p7zip'; exit 1; }
          rpm -qlp "$rpmf" | grep -qx /usr/bin/uzip2 || { echo 'rpm 里没有 /usr/bin/uzip2'; exit 1; }
          rpm -qp --qf '%{ARCH}\n' "$rpmf" | grep -qx x86_64 || { echo 'rpm 架构不是 x86_64'; exit 1; }
          echo 'rpm 元数据 OK'

          echo '===== AppImage 结构 ====='
          # 用绝对路径：下面要 cd 到 /tmp 里解包，相对路径会解析错
          img="$PWD/$d/UZIP2-${v}-linux-x64.AppImage"
          test -f "$img" || { echo "缺少 $img"; exit 1; }
          # appimagetool 打的 AppImage 自带 squashfs：用 --appimage-extract 拆开检查内容，
          # 不需要 root、不需要 FUSE（拆包是用户态操作）。
          rm -rf /tmp/aimg && mkdir -p /tmp/aimg
          ( cd /tmp/aimg && "$img" --appimage-extract >/dev/null )
          test -x /tmp/aimg/squashfs-root/AppRun
          test -f /tmp/aimg/squashfs-root/uzip2.desktop
          test -f /tmp/aimg/squashfs-root/usr/share/metainfo/io.github.pingod.UZIP2.appdata.xml
          # 包内二进制必须与 tarball 里的逐字节相同（AppImage 打包不该改写它）
          rm -rf /tmp/tarx && mkdir -p /tmp/tarx
          tar -xzf "$d/UZIP2-${v}-linux-x64.tar.gz" -C /tmp/tarx
          cmp "/tmp/aimg/squashfs-root/usr/bin/uzip2" \
              "/tmp/tarx/UZIP2-${v}-linux-x64/UZIP2"
          echo 'AppImage 内容 OK（二进制与 tarball 一致）'

      - name: Install the deb and smoke test
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.value }}"
          # apt install ./xxx.deb 会真的解析 Depends：字段写错就在这里失败，
          # 而不是等用户装的时候才发现。
          sudo apt-get install -y "./artifacts/$v/uzip2_${v}_amd64.deb"
          which uzip2
          uzip2 --version
          test -f /usr/share/applications/uzip2.desktop || { echo '桌面入口没装上'; exit 1; }
          mkdir -p /tmp/t && cd /tmp/t
          echo hello > a.txt && 7z a p.zip a.txt >/dev/null
          uzip2 extract p.zip -o out
          test -f out/a.txt || { echo 'deb 安装后解压冒烟失败'; exit 1; }
          # 卸载要能干净移除，但**不能**碰用户的 ~/.config/uzip2
          sudo dpkg -r uzip2
          test ! -e /usr/bin/uzip2 || { echo '卸载后 /usr/bin/uzip2 仍在'; exit 1; }

      - name: Check the rpm payload and run it
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.value }}"
          f="artifacts/$v/uzip2-${v}-1.x86_64.rpm"
          test -f "$f" || { echo "缺少 $f"; exit 1; }

          # 只查询包文件本身（rpm -qip/-qlp/-qp 不碰系统 rpmdb），
          # 不在这里 `rpm -ivh`：Ubuntu 上的 rpm 与 Fedora 的 rpmdb 布局不同，
          # 装进去容易受 runner 镜像版本影响而无谓地红。真正的安装验证放在
          # arch-package / deb 两步（pacman -U 与 apt install 都验了真装）。
          rpm -qip "$f"
          rpm -qp --requires "$f"
          rpm -qlp "$f"

          rpm -qp --requires "$f" | grep -q p7zip || { echo 'Requires 里没有 p7zip'; exit 1; }
          rpm -qlp "$f" | grep -qx /usr/bin/uzip2 || { echo '包里没有 /usr/bin/uzip2'; exit 1; }
          # 架构字段必须真是 aarch64/x86_64，别打出一个机器类型不符的包
          rpm -qp --qf '%{ARCH}\n' "$f" | grep -qx x86_64 || { echo 'rpm 架构不是 x86_64'; exit 1; }

          # 拆 payload 验内容：解出来的二进制必须是未 strip 的单文件 bundle，
          # 且能真的跑起来（strip 过的 .NET bundle 运行时报 Arithmetic overflow）。
          repo=$(pwd)
          rm -rf /tmp/rpmx && mkdir -p /tmp/rpmx && cd /tmp/rpmx
          rpm2cpio "$repo/$f" | cpio -idm --quiet
          test -x ./usr/bin/uzip2 || { echo 'payload 里没有可执行的 usr/bin/uzip2'; exit 1; }
          ./usr/bin/uzip2 --version
          echo hello > a.txt
          7z a p.zip a.txt >/dev/null
          ./usr/bin/uzip2 extract p.zip -o out
          test -f out/a.txt || { echo 'rpm payload 解压冒烟失败'; exit 1; }

      - name: Run the AppImage CLI (no FUSE on runners)
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.value }}"
          img="$(pwd)/artifacts/$v/UZIP2-${v}-linux-x64.AppImage"
          chmod +x "$img"
          # AppRun 会把参数原样透传给同一个二进制，所以 CLI 用法必须成立；
          # runner 上不一定有 FUSE，用 --appimage-extract-and-run 走解包运行。
          "$img" --appimage-extract-and-run --version || "$img" --version

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: UZIP2-linux-packages
          path: |
            artifacts/${{ steps.ver.outputs.value }}/*.deb
            artifacts/${{ steps.ver.outputs.value }}/*.rpm
            artifacts/${{ steps.ver.outputs.value }}/*.AppImage
            artifacts/${{ steps.ver.outputs.value }}/*.deb.sha256
            artifacts/${{ steps.ver.outputs.value }}/*.rpm.sha256
            artifacts/${{ steps.ver.outputs.value }}/*.AppImage.sha256
            artifacts/${{ steps.ver.outputs.value }}/SHA256SUMS-linux-packages.txt
          retention-days: 14

  arch-package:
    # 源码包从 tag 归档拉取；手动触发时也跑（用于验证工作流本身）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git dotnet-sdk 7zip fontconfig freetype2 libice libsm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create builder user
        shell: bash
        run: |
          # makepkg 拒绝以 root 运行（实测报「不能使用 root 用户运行 makepkg」，
          # 且 --printsrcinfo 也会先撞上这个检查 —— 它只跳过"构建"和"架构"检查，
          # 不跳过 EUID 检查）。所以下面所有 makepkg 调用都通过 su builder 执行。
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Validate both PKGBUILDs
        shell: bash
        run: |
          set -euo pipefail
          # 用 builder 身份跑：--printsrcinfo 会真正求值 PKGBUILD（含 arch 专属数组），
          # 比 grep 更能发现"数组名写错 / 缺 sha256 / 架构没声明"这类问题。
          # 路径由外层 shell 展开后再传给 builder：su 不保证把 GITHUB_WORKSPACE
          # 传进子 shell，写在单引号里可能变成空串（那样 cd 会静默跑到根目录）。
          arch_dir="$GITHUB_WORKSPACE/packaging/arch"
          test -d "$arch_dir" || { echo "找不到 $arch_dir"; exit 1; }
          su builder -c "cd '$arch_dir' && for p in PKGBUILD PKGBUILD-bin; do
            echo \"===== \$p =====\"
            makepkg --printsrcinfo -p \"\$p\" > \"/tmp/\$p.srcinfo\" || exit 1
            sed \"s/^/  /\" \"/tmp/\$p.srcinfo\"
          done"

          # 断言放在 su 外面（root 能读 builder 写的文件），逻辑与风格保持显式：
          # 架构、防 strip、以及"两个架构各自有 sha256"是这套包能用的前提。
          for p in PKGBUILD PKGBUILD-bin; do
            f="/tmp/$p.srcinfo"
            grep -q $'^\tarch = x86_64$'  "$f" || { echo "$p 缺 x86_64"; exit 1; }
            grep -q $'^\tarch = aarch64$' "$f" || { echo "$p 缺 aarch64"; exit 1; }
            # strip/debug 必须关掉，否则 .NET 单文件 bundle 会被切坏
            grep -q $'^\toptions = !strip$' "$f" || { echo "$p 没有 !strip"; exit 1; }
            grep -q $'^\toptions = !debug$' "$f" || { echo "$p 没有 !debug"; exit 1; }
            # 两个架构都必须有 sha256，且不能是 SKIP（SKIP 等于不校验）
            grep -qE $'^\tsha256sums(_x86_64)? = [0-9a-f]{64}$' "$f" \
              || { echo "$p 的 x86_64 sha256 不是真值"; exit 1; }
            echo "$p 校验通过"
          done
          # PKGBUILD-bin 是架构专属数组，必须两个架构各一份 hash
          grep -qE $'^\tsha256sums_aarch64 = [0-9a-f]{64}$' /tmp/PKGBUILD-bin.srcinfo \
            || { echo 'PKGBUILD-bin 的 aarch64 sha256 不是真值'; exit 1; }
          echo '两个 PKGBUILD 校验通过'

      - name: Build package (source PKGBUILD)
        shell: bash
        run: |
          # builder 用户已在上一步创建（makepkg 拒绝 root）
          cp "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD" /tmp/PKGBUILD
          chown builder /tmp/PKGBUILD
          su builder -c 'cd /tmp && makepkg -f --noconfirm'

      - name: Install and smoke test
        shell: bash
        run: |
          pacman -U --noconfirm /tmp/uzip2-*.pkg.tar.zst
          uzip2 --version
          mkdir -p /tmp/t && cd /tmp/t
          echo hello > a.txt && 7z a p.zip a.txt >/dev/null
          uzip2 extract p.zip -o out
          test -f out/a.txt || { echo 'Arch 安装包冒烟失败'; exit 1; }

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: uzip2-arch
          path: /tmp/uzip2-*.pkg.tar.zst
          retention-days: 14
